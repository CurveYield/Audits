name: Deep Assurance delivery artifact v3

on:
  push:
    branches:
      - rehearsal/deep-assurance-v16-2-erc20-v1
    paths:
      - .github/workflows/deep-assurance-delivery-v3.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact rehearsal branch
        uses: actions/checkout@v4
        with:
          ref: rehearsal/deep-assurance-v16-2-erc20-v1
          fetch-depth: 0

      - name: Record delivery run identity
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('deep-assurance-v16-2-erc20-rehearsal-v1/FINAL_AUDIT_PACKET_v3/DELIVERY_ARTIFACT_RUN_v3.json')
          p.write_text(json.dumps({
            'schemaVersion':'deep-assurance-delivery-artifact-run-v3',
            'runId':int(os.environ['RUN_ID']),
            'triggerCommit':os.environ['TRIGGER_SHA'],
            'artifactName':'deep-assurance-v16-2-erc20-final-packet-v3',
            'packetPath':'deep-assurance-v16-2-erc20-rehearsal-v1/FINAL_AUDIT_PACKET_v3/'
          }, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Commit delivery run receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deep-assurance-v16-2-erc20-rehearsal-v1/FINAL_AUDIT_PACKET_v3/DELIVERY_ARTIFACT_RUN_v3.json
          git commit -m "Record Deep Assurance v3 delivery artifact run [skip ci]"
          git push origin HEAD:rehearsal/deep-assurance-v16-2-erc20-v1

      - name: Upload exact final packet
        uses: actions/upload-artifact@v4
        with:
          name: deep-assurance-v16-2-erc20-final-packet-v3
          path: deep-assurance-v16-2-erc20-rehearsal-v1/FINAL_AUDIT_PACKET_v3/
          if-no-files-found: error
          compression-level: 0
